[project]
name = "fdash"
version = "0.1.0"
description = "Forecast dashboard: published forecasts with vintages, actuals and benchmark models"
readme = "CLAUDE.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "statsforecast>=1.7",
    "statsmodels>=0.14",
    "tenacity>=9.0",
    "typer>=0.12",
    "uvicorn>=0.30",
    "xlrd>=2.0.2",
]

[project.scripts]
fdash = "fdash.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdash"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI arguments through default values.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# iCloud marks files inside .venv as hidden and Python 3.12 skips hidden .pth files.
# On such machines keep .venv as a symlink to a folder outside iCloud (see README).
link-mode = "copy"
