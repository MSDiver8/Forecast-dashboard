# Indicator catalog. An indicator is a definition (measure, unit, base); the area is a
# separate dimension. Series of different sources are compared only when indicator, unit,
# base and area coincide (CLAUDE.md, SPEC 4.1). Notes record known caveats per series.

# Curated indicators shown in the dashboard: every one has an official actual series and
# two or more forecast sources with the same definition (unit, base, area).
featured:
  - id: brent
    indicator: brent_price
    area: WORLD
    frequency: A
    category: "Сырьевые рынки"
    title: "Нефть Brent"
    short: "Brent"
    subtitle: "средняя за период, номинальная"
    description: "Средняя цена нефти Brent, долл. за баррель. Прогноз EIA, Всемирного банка, рыночные предпосылки ЕЦБ и Банка Англии, опрос аналитиков Банка России."
    context: {indicator: brent_price, frequency: M, label: "средняя цена за месяц"}
  - id: ru-inflation
    indicator: cpi_dec
    area: RU
    frequency: A
    category: "Россия · цены"
    title: "Инфляция в России"
    short: "Инфляция РФ"
    subtitle: "декабрь к декабрю предыдущего года"
    description: "Рост потребительских цен в декабре к декабрю предыдущего года, %. Прогноз Банка России, консенсус аналитиков и МВФ."
    context: {indicator: cpi_yoy_m, frequency: M, label: "инфляция за месяц к тому же месяцу прошлого года"}
  - id: ru-key-rate
    indicator: key_rate_avg
    area: RU
    frequency: A
    category: "Россия · деньги"
    title: "Ключевая ставка"
    short: "Ключевая ставка"
    subtitle: "в среднем за год с учётом выходных дней"
    description: "Средняя ключевая ставка за год с учётом выходных, % годовых. Траектория Банка России против ожиданий аналитиков."
    context: {indicator: key_rate_avg, frequency: M, label: "средняя ставка за месяц"}
  - id: ru-gdp
    indicator: gdp_growth
    area: RU
    frequency: A
    category: "Россия · экономика"
    title: "Рост ВВП России"
    short: "ВВП РФ"
    subtitle: "реальный ВВП к предыдущему году"
    description: "Темп роста реального ВВП, % к предыдущему году. Прогноз Банка России, консенсус аналитиков и МВФ."
    context: {indicator: gdp_yoy_q, frequency: Q, label: "рост за квартал к тому же кварталу прошлого года (Росстат)"}
  - id: us-gdp
    indicator: gdp_qoq_saar
    area: US
    frequency: Q
    category: "США · экономика"
    title: "Реальный ВВП США"
    short: "ВВП США"
    subtitle: "рост к предыдущему кварталу в годовом выражении (SAAR)"
    description: "Рост реального ВВП, квартал к кварталу в годовом выражении (SAAR). Бюджетное управление Конгресса (CBO), опрос профессиональных прогнозистов ФРБ Филадельфии, Fannie Mae и TD Economics."
    added: 2026-10-13
  - id: uk-cpi
    indicator: cpi_yoy_q
    area: GB
    frequency: Q
    category: "Великобритания · цены"
    title: "Инфляция в Великобритании"
    short: "Инфляция ВБ"
    subtitle: "CPI, к тому же кварталу прошлого года"
    description: "CPI, рост к тому же кварталу прошлого года. Банк Англии (выпуски с 2004 года) и Управление бюджетной ответственности (OBR)."
    added: 2026-10-13
  - id: uk-gdp
    indicator: gdp_yoy_q
    area: GB
    frequency: Q
    category: "Великобритания · экономика"
    title: "Реальный ВВП Великобритании"
    short: "ВВП ВБ"
    subtitle: "рост к тому же кварталу прошлого года"
    description: "Рост реального ВВП к тому же кварталу прошлого года. Банк Англии (выпуски с 2007 года) и OBR."
    added: 2026-10-13
  - id: ea-inflation
    indicator: cpi_avg
    area: EA
    frequency: A
    category: "Мир · цены"
    title: "Инфляция в еврозоне"
    short: "Инфляция ЕЗ"
    subtitle: "HICP, в среднем за год к предыдущему году; еврозона в меняющемся составе"
    description: "Гармонизированный индекс потребительских цен (HICP), % в среднем за год. Прогноз ЕЦБ, опрос профессиональных прогнозистов SPF и МВФ."
    context: {indicator: cpi_yoy_m, frequency: M, label: "HICP за месяц к тому же месяцу прошлого года"}

# Start page announcement: the indicator, a short text and the sources whose newest release is drawn.
news:
  featured: uk-cpi
  published: 2026-10-13
  text: "Добавлены прогнозы Банка Англии и Управления бюджетной ответственности (OBR). Прогноз Банка Англии от июля 2026 года предполагает повышение инфляции до 3,2% в IV квартале 2026 года, прогноз OBR от марта 2026 года — снижение до 2,1% во II квартале 2026 года."
  sources: [boe_mpr_uk, obr_efo]
  start: "2024-Q1"
  end: "2028-Q4"

# How sources are named and coloured in the dashboard, with what a user must know about them.
source_info:
  eia_brent_spot: {short: "Факт (EIA)", color: "#62b4dc", description: "Управление энергетической информации США (EIA): спотовая цена Brent FOB, ряд RBRTE; месячные и годовые средние."}
  cbr_stats: {short: "Факт (Банк России)", color: "#62b4dc", description: "Инфляция — данные Росстата в публикации Банка России; ключевая ставка — дневные значения, среднее по календарным дням."}
  wb_wdi: {short: "Факт (Росстат/WDI)", color: "#62b4dc", description: "Всемирный банк, база World Development Indicators: рост реального ВВП России по данным Росстата."}
  eurostat_hicp: {short: "Факт (Евростат)", color: "#62b4dc", description: "Евростат: HICP еврозоны — среднегодовой темп (prc_hicp_ainr) и темп к тому же месяцу прошлого года (prc_hicp_minr), ECOICOP ver. 2."}
  rosstat_gdp_q: {short: "Факт (Росстат)", color: "#62b4dc", description: "Росстат: ВВП России по кварталам — индекс физического объёма к соответствующему кварталу предыдущего года."}
  eia_steo: {short: "EIA", color: "#ed7b24", description: "Управление энергетической информации США (EIA): ежемесячный краткосрочный прогноз энергетических рынков Short-Term Energy Outlook.", caveat: "EIA публикует прогноз по месяцам; квартальные и годовые значения — средние месяцев одного выпуска."}
  wb_cmo: {short: "Всемирный банк", color: "#168443", description: "Всемирный банк: доклад о сырьевых рынках Commodity Markets Outlook, апрель и октябрь; прогноз среднегодовых цен."}
  ecb_mpd: {short: "ЕЦБ", color: "#245285", description: "Европейский центральный банк: предпосылка о цене нефти в макроэкономических прогнозах экспертов Евросистемы и ЕЦБ, 4 раза в год.", caveat: "Предпосылка о цене нефти по фьючерсам Brent, а не собственный прогноз ЕЦБ."}
  ecb_mpd_macro: {short: "ЕЦБ", color: "#245285", description: "Европейский центральный банк: макроэкономический прогноз экспертов Евросистемы и ЕЦБ, 4 раза в год."}
  boe_mpr: {short: "Банк Англии", color: "#9a4d8d", description: "Банк Англии: предпосылка о цене нефти в докладе о денежно-кредитной политике (Monetary Policy Report).", caveat: "Предпосылка по фьючерсам Brent, а не собственный прогноз. Публикуется средняя за IV квартал года (в апреле 2026 года — за II квартал), поэтому видна только на квартальной шкале."}
  cbr_survey: {short: "Опрос аналитиков", color: "#b44343", description: "Макроэкономический опрос Банка России: медиана 30+ экономистов; полоса — 10–90-й процентили.", caveat: "Медиана ответов участников опроса, а не прогноз Банка России. День публикации неизвестен: выпуск датирован 1-м числом месяца опроса и помечен «≈»."}
  cbr_mtf: {short: "Банк России", color: "#173c68", description: "Банк России: среднесрочный прогноз по итогам опорных заседаний по ключевой ставке, 4 раза в год.", caveat: "Банк России публикует прогноз диапазоном: на графике — середина, полоса — диапазон."}
  imf_weo: {short: "МВФ", color: "#936728", description: "Международный валютный фонд: World Economic Outlook, апрель и октябрь.", caveat: "Через API МВФ доступны только два последних выпуска; архив выпусков закрыт для автоматической загрузки."}
  bea_nipa: {short: "Факт (BEA)", color: "#62b4dc", description: "Бюро экономического анализа США (BEA): рост реального ВВП к предыдущему кварталу в годовом выражении, NIPA, таблица 1.1.1, ряд A191RL."}
  ons_cpi: {short: "Факт (ONS)", color: "#62b4dc", description: "Управление национальной статистики Великобритании (ONS): годовой темп CPI, квартальные значения ряда D7G7."}
  ons_gdp: {short: "Факт (ONS)", color: "#62b4dc", description: "Управление национальной статистики Великобритании (ONS): рост реального ВВП к тому же кварталу прошлого года, ряд IHYR; берётся последний из выпусков PN2 (первая оценка) и QNA."}
  boe_mpr_uk: {short: "Банк Англии", color: "#9a4d8d", description: "Банк Англии: центральный прогноз Комитета по денежно-кредитной политике (MPC) в Monetary Policy Report (до ноября 2019 года — Inflation Report), 4 раза в год; история всех докладов из Projections Databank.", caveat: "До ноября 2025 года у докладов известен только месяц публикации: выпуск датирован 1-м числом месяца и помечен «≈». В апреле 2026 года Банк Англии не публиковал центральный прогноз."}
  obr_efo: {short: "OBR", color: "#2f7d6d", description: "Управление бюджетной ответственности Великобритании (OBR): прогноз Economic and fiscal outlook, 2 раза в год; детальные таблицы по экономике."}
  cbo_econ: {short: "CBO", color: "#7a3e9d", description: "Бюджетное управление Конгресса США (CBO): экономические прогнозы на 10 лет, 1–2 раза в год.", caveat: "CBO указывает только месяц выпуска, без дня: выпуск датирован 1-м числом месяца и помечен «≈»."}
  spf_philly: {short: "Опрос SPF (ФРБ Филадельфии)", color: "#c4572a", description: "Федеральный резервный банк Филадельфии: ежеквартальный опрос профессиональных прогнозистов (Survey of Professional Forecasters) — прогноз на квартал опроса и четыре следующих квартала.", caveat: "Темп рассчитан из медианного прогноза уровня ВВП, а не как медиана прогнозов темпа. Опросы до 1992 года прогнозировали ВНП и не загружаются."}
  fannie_mae: {short: "Fannie Mae", color: "#0e7c86", description: "Fannie Mae (Федеральная национальная ипотечная ассоциация США): ежемесячный экономический прогноз подразделения Economic & Strategic Research.", caveat: "Значения взяты из PDF-выпусков; прогнозные кварталы в источнике выделены цветом."}
  td_economics: {short: "TD Economics", color: "#4d8b31", description: "TD Economics — аналитическое подразделение канадской банковской группы TD: экономический прогноз Quarterly Economic Forecast, 4 раза в год.", caveat: "Значения взяты из PDF-выпусков. В выпусках до декабря 2025 года таблица опубликована изображением, поэтому они не загружены."}
  ecb_spf: {short: "Опрос SPF", color: "#7062bf", description: "Европейский центральный банк: ежеквартальный опрос профессиональных прогнозистов (Survey of Professional Forecasters), среднее ожиданий участников."}

groups:
  - {id: A, name: "Россия, годовые"}
  - {id: B, name: "Мир, годовые"}
  - {id: C, name: "Нефть Brent"}
  - {id: F, name: "Зерновые рынки"}
  - {id: Q, name: "США и Великобритания, квартальные"}

areas:
  - {id: WORLD, name: "Мир", kind: aggregate}
  - {id: RU, name: "Россия", kind: country}
  - {id: EA, name: "Еврозона", kind: aggregate}
  - {id: US, name: "США", kind: country}
  - {id: DE, name: "Германия", kind: country}
  - {id: FR, name: "Франция", kind: country}
  - {id: IT, name: "Италия", kind: country}
  - {id: ES, name: "Испания", kind: country}
  - {id: GB, name: "Великобритания", kind: country}
  - {id: JP, name: "Япония", kind: country}
  - {id: CN, name: "Китай", kind: country}

indicators:
  - id: brent_price
    name: "Цена нефти Brent"
    unit: "долл. США за баррель"
    transform: avg_period
    base: "средняя за период, номинальная"
    groups: [C]
    precision: 2
    actual_sources: {WORLD: eia_brent_spot}
    description: "Средняя спотовая цена нефти Brent за месяц, квартал или год."
  - id: gdp_growth
    name: "Рост реального ВВП"
    unit: "%, год к году"
    transform: yoy
    base: "реальный ВВП, в среднем за год к предыдущему году"
    groups: [A, B]
    precision: 1
    actual_sources: {RU: wb_wdi}
  - id: cpi_avg
    name: "Инфляция, в среднем за год"
    unit: "% к предыдущему году"
    transform: avg_year_yoy
    base: "средний за год индекс цен к предыдущему году; еврозона и страны ЕС, Великобритания — HICP, остальные — национальный ИПЦ"
    groups: [A, B]
    precision: 1
    actual_sources: {EA: eurostat_hicp}
  - id: cpi_yoy_m
    name: "Инфляция, месяц к тому же месяцу прошлого года"
    unit: "% к тому же месяцу прошлого года"
    transform: yoy_m
    base: "индекс потребительских цен за месяц к тому же месяцу прошлого года; в декабре — декабрь к декабрю; еврозона — HICP"
    groups: [A, B]
    precision: 1
    averageable: false
    actual_sources: {RU: cbr_stats, EA: eurostat_hicp}
  - id: cpi_dec
    name: "Инфляция, декабрь к декабрю"
    unit: "% к декабрю предыдущего года"
    transform: dec_dec
    base: "индекс цен на конец года к концу предыдущего года"
    groups: [A]
    precision: 1
    actual_sources: {RU: cbr_stats}
  - id: unemployment_avg
    name: "Уровень безработицы, в среднем за год"
    unit: "% рабочей силы"
    transform: avg_year
    base: "в среднем за год"
    groups: [A, B]
    precision: 1
  - id: key_rate_avg
    name: "Ключевая ставка Банка России, в среднем за год"
    unit: "% годовых"
    transform: avg_year
    base: "в среднем за год с учётом выходных дней"
    groups: [A]
    precision: 1
    actual_sources: {RU: cbr_stats}
  - id: exports_usd
    name: "Экспорт товаров и услуг"
    unit: "млрд долл. США в год"
    transform: sum_year
    groups: [A]
    precision: 0
  - id: imports_usd
    name: "Импорт товаров и услуг"
    unit: "млрд долл. США в год"
    transform: sum_year
    groups: [A]
    precision: 0
  - id: oil_tax_price
    name: "Цена нефти для налогообложения"
    unit: "долл. США за баррель"
    transform: avg_year
    base: "в среднем за год; цена российской нефти, публикуемая Минэкономразвития"
    groups: [A]
    precision: 1
  - id: gdp_qoq_saar
    name: "Рост реального ВВП, квартал к предыдущему кварталу в годовом выражении"
    unit: "%, к пред. кварталу в годовом выражении"
    transform: qoq_saar
    base: "реальный ВВП с устранением сезонности, рост к предыдущему кварталу в годовом выражении (SAAR)"
    groups: [Q]
    precision: 1
    averageable: false
    actual_sources: {US: bea_nipa}
    description: "Темп роста реального ВВП к предыдущему кварталу, пересчитанный в годовое выражение."
  - id: gdp_yoy_q
    name: "Рост реального ВВП, квартал к тому же кварталу прошлого года"
    unit: "%, к тому же кварталу прошлого года"
    transform: yoy_q
    base: "реальный ВВП (цепные объёмы) с устранением сезонности, к тому же кварталу прошлого года"
    groups: [Q]
    precision: 1
    averageable: false
    actual_sources: {GB: ons_gdp, RU: rosstat_gdp_q}
  - id: cpi_yoy_q
    name: "Инфляция, квартал к тому же кварталу прошлого года"
    unit: "%, к тому же кварталу прошлого года"
    transform: yoy_q
    base: "средний за квартал индекс потребительских цен к тому же кварталу прошлого года"
    groups: [Q]
    precision: 1
    averageable: false
    actual_sources: {GB: ons_cpi}

series:
  # Group C: Brent
  - {source: eia_brent_spot, code: RBRTE, indicator: brent_price, area: WORLD}
  - {source: eia_steo, code: BREPUUS, indicator: brent_price, area: WORLD,
     note: "Только месячные значения; годовые и квартальные — среднее месяцев выпуска"}
  - {source: wb_cmo, code: "Crude oil, Brent", indicator: brent_price, area: WORLD}
  - {source: boe_mpr, code: "Oil prices", indicator: brent_price, area: WORLD,
     note: "Рыночная предпосылка по фьючерсам Brent, средняя за IV (в апреле 2026 — II) квартал года; не собственный прогноз"}
  - {source: ecb_mpd, code: "MPD A1.POU.U", indicator: brent_price, area: WORLD,
     note: "Предпосылка ЕЦБ по фьючерсам Brent; годовые и квартальные средние"}
  - {source: cbr_survey, code: "13", indicator: brent_price, area: WORLD,
     note: "Медиана опроса; диапазон — 10–90-й процентили; вопрос задавался с 12.2023 по 02.2025"}
  # Group A: Bank of Russia survey
  - {source: cbr_survey, code: "1", indicator: cpi_dec, area: RU}
  - {source: cbr_survey, code: "2", indicator: cpi_avg, area: RU}
  - {source: cbr_survey, code: "3", indicator: key_rate_avg, area: RU}
  - {source: cbr_survey, code: "4", indicator: gdp_growth, area: RU}
  - {source: cbr_survey, code: "5", indicator: unemployment_avg, area: RU}
  - {source: cbr_survey, code: "9", indicator: exports_usd, area: RU}
  - {source: cbr_survey, code: "10", indicator: imports_usd, area: RU}
  - {source: cbr_survey, code: "12", indicator: oil_tax_price, area: RU}
  # IMF WEO (groups A and B)
  - {source: imf_weo, code: NGDP_RPCH, indicator: gdp_growth, area: RU}
  - {source: imf_weo, code: NGDP_RPCH, indicator: gdp_growth, area: WORLD}
  - {source: imf_weo, code: NGDP_RPCH, indicator: gdp_growth, area: EA}
  - {source: imf_weo, code: NGDP_RPCH, indicator: gdp_growth, area: US}
  - {source: imf_weo, code: NGDP_RPCH, indicator: gdp_growth, area: DE}
  - {source: imf_weo, code: NGDP_RPCH, indicator: gdp_growth, area: FR}
  - {source: imf_weo, code: NGDP_RPCH, indicator: gdp_growth, area: IT}
  - {source: imf_weo, code: NGDP_RPCH, indicator: gdp_growth, area: ES}
  - {source: imf_weo, code: NGDP_RPCH, indicator: gdp_growth, area: GB}
  - {source: imf_weo, code: NGDP_RPCH, indicator: gdp_growth, area: JP}
  - {source: imf_weo, code: NGDP_RPCH, indicator: gdp_growth, area: CN}
